<title>Futbol Manager 3D Match</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* one screen: the pitch fills it, scoreboard floats on top, controls sit in a bar at the bottom */
:root{--ink:#F4F1E8;--pitch-night:#0E1A14;--panel:rgba(14,22,18,.78);--control:#22342B;--control-edge:#3A5446;--accent:#F2C14E;--font:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--pitch-night);color:var(--ink);font:15px/1.3 var(--font);overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:700;white-space:nowrap}
#top .sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.5)}
#score{font-size:18px;font-variant-numeric:tabular-nums}
#clock{font-variant-numeric:tabular-nums;color:var(--accent);min-width:48px;text-align:right}
#note{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--panel);padding:6px 12px;border-radius:8px;max-width:92vw;text-align:center;transition:opacity .3s}
#note:empty{opacity:0}
#who{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom,0px));background:var(--panel);padding:4px 10px;border-radius:6px;font-weight:600;font-size:13px;white-space:nowrap}
#who:empty{display:none}
#bar{position:fixed;left:0;right:0;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);display:flex;flex-direction:column;gap:8px}
#row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--control);border:1px solid var(--control-edge);border-radius:8px;padding:9px 12px;min-width:44px;cursor:pointer}
button:active{filter:brightness(1.3)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--pitch-night);font-weight:600;padding:24px;text-align:center}
</style>
<script>window.MATCH3D={player:"./assets/player.glb.json",ball:"./assets/ball.glb.json",frames:"./data/match.bin.json"};</script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
<canvas id="c"></canvas>
<div id="top"><span class="sw" id="sw0"></span><span id="n0"></span><span id="score">0 - 0</span><span id="n1"></span><span class="sw" id="sw1"></span><span id="clock">0:00</span></div>
<div id="note" role="status"></div>
<div id="who" aria-label="Player on the ball"></div>
<div id="bar">
  <input id="seek" type="range" min="0" max="1" step="0.5" value="0" aria-label="Match time">
  <div id="row">
    <button id="play" aria-label="Play or pause">Pause</button>
    <button id="speed" aria-label="Playback speed">1x</button>
    <button id="cam" aria-label="Camera">Camera</button>
    <button id="next" aria-label="Skip to the next shot">Next shot</button>
    <button id="shade" aria-label="Shadow quality">Shadows on</button>
  </div>
</div>
<div id="load">Loading the match…</div>
<script type="module" src="./viewer.js"></script>
