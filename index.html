<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futbol Manager</title>
<meta name="theme-color" content="#22082F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/game.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app"></div>
<div id="layer" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<!-- core: helpers, static data, players, world state, calendar -->
<script src="js/core/util.js"></script>
<script src="js/core/data.js"></script>
<script src="js/core/rosters.js"></script>
<script src="js/core/players.js"></script>
<script src="js/core/bio.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/calendar.js"></script>
<!-- engine: match simulation + live 2D view -->
<script src="js/engine/match.js"></script>
<script src="js/engine/live.js"></script>
<!-- systems: run once per weekly turn -->
<script src="js/systems/training.js"></script>
<script src="js/systems/finance.js"></script>
<script src="js/systems/scouting.js"></script>
<script src="js/systems/transfers.js"></script>
<script src="js/systems/season.js"></script>
<script src="js/systems/ai.js"></script>
<script src="js/systems/brain.js"></script>
<!-- ui: framework, then screens -->
<script src="js/ui/ui.js"></script>
<script src="js/ui/navigation.js"></script>
<script src="js/ui/screens-hub.js"></script>
<script src="js/ui/screens-squad.js"></script>
<script src="js/ui/screens-market.js"></script>
<script src="js/ui/screens-match.js"></script>
<script src="js/ui/screens-admin.js"></script>
</body>
</html>
