name: Jev lead decision

# A proposal committed under docs/engine-qa/proposals/ is sent to Jev (genuine provider, owner's secret).
# The decision record is printed in the log (JEV_DECISION_RECORD line) and uploaded as an artifact;
# a developer commits it to docs/engine-qa/decisions/. Read-only, never deploys.
on:
  push:
    branches: [feat/rulebook-shape-jev-qa, ccr-063c99f1-fomx5n]
    paths: ['docs/engine-qa/proposals/**']

permissions:
  contents: read

concurrency:
  group: jev-decide-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Decision-loop contract tests (mocked)
        run: node tests/jev-lead.cjs
      - name: Ask Jev about each new or changed proposal
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          mkdir -p out
          files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'docs/engine-qa/proposals/*.json')
          [ -z "$files" ] && { echo "No new proposals."; exit 0; }
          status=0
          for f in $files; do
            echo "== $f"
            node scripts/jev-lead.cjs "$f" --out "out/$(basename "$f")" || status=$?
          done
          exit $([ $status -eq 1 ] && echo 1 || echo 0)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jev-decisions
          path: out/
          if-no-files-found: ignore
